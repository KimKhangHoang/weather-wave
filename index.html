<!doctype html>
<html lang="en">
    <head>
        <title>WeatherWave</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Tab icon: the SVG logo where supported, the .ico in older browsers. Home screen icons come from the PNGs. -->
        <link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
        <link rel="manifest" href="icons/site.webmanifest" />
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <h1><img class="logo" src="icons/favicon.svg" alt="" />WeatherWave</h1>

        <div class="search-bar-container">
            <div class="weather-search">
                <!-- autocomplete off: the browser's own list of past entries would cover our suggestions.
                     enterkeyhint labels the phone keyboard's Enter key as "Search" (or a magnifying glass).
                     The role and aria attributes tell screen readers this box offers a list of suggestions (script.js keeps them up to date). -->
                <input
                    type="text"
                    id="location"
                    placeholder="Enter location"
                    autocomplete="off"
                    enterkeyhint="search"
                    aria-label="Search for a place"
                    role="combobox"
                    aria-autocomplete="list"
                    aria-controls="suggestions"
                    aria-expanded="false"
                />
                <button type="button" id="useLocation" aria-label="Use my location" title="Use my location">
                    <span class="fa-solid fa-location-crosshairs" aria-hidden="true"></span>
                </button>
                <button id="searchWeather">Search</button>
                <!-- Matching places, filled in by script.js while typing -->
                <ul id="suggestions" class="suggestions" role="listbox" aria-label="Matching places" hidden></ul>
                <!-- Read out by screen readers when suggestions arrive, e.g. "5 places found". Not shown on screen. -->
                <p id="suggestionStatus" class="visually-hidden" role="status"></p>
            </div>
            <button
                type="button"
                id="unitSwitch"
                role="switch"
                aria-checked="false"
                aria-label="Show temperatures in Fahrenheit"
            >
                <span class="unit-switch-thumb"></span>
                <span class="unit-option active" data-unit="C">°C</span>
                <span class="unit-option" data-unit="F">°F</span>
            </button>
        </div>

        <!-- Read out by screen readers while the weather loads and when it arrives, e.g. "Weather for Paris, France: 13°C, light rain". Not shown on screen. -->
        <p id="weatherStatus" class="visually-hidden" role="status"></p>

        <footer class="attribution">
            <span class="credit"
                >Weather data by
                <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
                ·</span
            >
            <span class="credit"
                >Place names ©
                <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
                    >OpenStreetMap contributors</a
                ></span
            >
        </footer>

        <script src="icons.js"></script>
        <script src="script.js"></script>

        <!-- Visit counting by GoatCounter (no IP addresses stored). Visits from localhost aren't counted. -->
        <script
            data-goatcounter="https://weatherwave.goatcounter.com/count"
            async
            src="https://gc.zgo.at/count.js"
        ></script>
    </body>
</html>
